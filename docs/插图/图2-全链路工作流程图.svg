<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1150" viewBox="0 0 920 1150" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="920" height="1150" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" fill="#111827" font-size="17" font-weight="bold">每日 05:00 无人值守全链路工作流程</text>

  <!-- 开始 -->
  <rect x="330" y="56" width="260" height="46" rx="23" fill="#1f3a5f"/>
  <text x="460" y="85" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Windows 计划任务定时触发（时刻可配置，当前部署 05:00）</text>
  <line x1="460" y1="102" x2="460" y2="126" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 锁检测菱形 -->
  <polygon points="460,130 570,168 460,206 350,168" fill="#f5f6f8" stroke="#1f3a5f" stroke-width="1.4"/>
  <text x="460" y="163" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="bold">锁检测</text>
  <text x="460" y="181" text-anchor="middle" fill="#111827" font-size="11">已有全链在跑？</text>
  <path d="M 570 168 L 700 168 L 700 168" stroke="#1f2937" fill="none"/>
  <line x1="570" y1="168" x2="688" y2="168" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="692" y="146" width="170" height="44" rx="6" fill="#f5f6f8" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="777" y="164" text-anchor="middle" fill="#1f2937" font-size="12">是 → 本次退出</text>
  <text x="777" y="182" text-anchor="middle" fill="#374151" font-size="10.5">（陈锁自动清理后继续）</text>
  <text x="445" y="222" text-anchor="end" fill="#374151" font-size="10.5">否</text>
  <line x1="460" y1="206" x2="460" y2="232" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 停API -->
  <rect x="300" y="236" width="320" height="46" rx="6" fill="#fff" stroke="#1f3a5f" stroke-width="1.4"/>
  <text x="460" y="256" text-anchor="middle" fill="#111827" font-size="13" font-weight="bold">停常驻 API（按 :8000 端口找 PID）</text>
  <text x="460" y="274" text-anchor="middle" fill="#374151" font-size="11">释放约 8GB 内存，为嵌入模型加载让出资源</text>
  <line x1="460" y1="282" x2="460" y2="306" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 阶段① 采集 -->
  <rect x="130" y="310" width="660" height="150" rx="8" fill="#f5f6f8" stroke="#1f3a5f" stroke-width="1.5"/>
  <rect x="130" y="310" width="150" height="30" rx="8" fill="#1f3a5f"/>
  <text x="205" y="331" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">阶段① 采集</text>
  <g font-size="12" fill="#111827">
    <rect x="150" y="352" width="150" height="42" rx="5" fill="#fff" stroke="#1f3a5f"/>
    <text x="225" y="378" text-anchor="middle">RSS 906 源扫描</text>
    <rect x="312" y="352" width="150" height="42" rx="5" fill="#fff" stroke="#1f3a5f"/>
    <text x="387" y="378" text-anchor="middle">CNNVD / KEV / OSV</text>
    <rect x="474" y="352" width="150" height="42" rx="5" fill="#fff" stroke="#1f3a5f"/>
    <text x="549" y="378" text-anchor="middle">arxiv 论文 6 主题</text>
    <rect x="636" y="352" width="134" height="42" rx="5" fill="#fff" stroke="#1f3a5f"/>
    <text x="703" y="378" text-anchor="middle">先知社区详情</text>
  </g>
  <text x="460" y="422" text-anchor="middle" fill="#1f2937" font-size="11.5">增量判重（url_norm）→ deepfill 正文回填 → Markdown 导出 → 每日简报</text>
  <text x="460" y="442" text-anchor="middle" fill="#1f3a5f" font-size="11" font-weight="bold">产物：SQLite 新增记录（实测当日 +63）· 失败阶段自动跳过，checkpoint 次日续</text>
  <line x1="460" y1="460" x2="460" y2="484" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 阶段② 富化 -->
  <rect x="130" y="488" width="660" height="128" rx="8" fill="#f5f6f8" stroke="#1f3a5f" stroke-width="1.5"/>
  <rect x="130" y="488" width="150" height="30" rx="8" fill="#1f3a5f"/>
  <text x="205" y="509" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">阶段② 富化</text>
  <g font-size="11.5" fill="#111827">
    <text x="460" y="540" text-anchor="middle">AI 信号复核 → L1 确定性富化 → L3 LLM 深度富化（DeepSeek）→ NVD 补全</text>
    <text x="460" y="562" text-anchor="middle">→ 文章/CVE 缝合 → CPE 资产 → 数据清洗 → 质量体检（8 步管线）</text>
  </g>
  <text x="460" y="596" text-anchor="middle" fill="#1f3a5f" font-size="11" font-weight="bold">产物：enrich_json（中文摘要/攻击类型/实体）· 缝合表 · 只处理新增条目，全幂等</text>
  <line x1="460" y1="616" x2="460" y2="640" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 阶段③ 切块 -->
  <rect x="230" y="644" width="460" height="56" rx="8" fill="#f5f6f8" stroke="#1f3a5f" stroke-width="1.5"/>
  <rect x="230" y="644" width="150" height="28" rx="8" fill="#1f3a5f"/>
  <text x="305" y="663" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">阶段③ 切块</text>
  <text x="460" y="690" text-anchor="middle" fill="#1f2937" font-size="11.5">语义分段 · 块 id = sha1(相对路径#块序号) · 元数据透传</text>
  <line x1="460" y1="700" x2="460" y2="724" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 阶段④ 向量增量 -->
  <rect x="230" y="728" width="460" height="66" rx="8" fill="#f5f6f8" stroke="#1f3a5f" stroke-width="1.5"/>
  <rect x="230" y="728" width="150" height="28" rx="8" fill="#1f3a5f"/>
  <text x="305" y="747" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">阶段④ 向量增量</text>
  <text x="460" y="752" text-anchor="middle" fill="#1f2937" font-size="11.5">WeMM-4B 本地嵌入（2560 维）· col.get 断点续传：已入库块自动跳过</text>
  <text x="460" y="772" text-anchor="middle" fill="#1f2937" font-size="11.5">CUDA OOM 自动降 batch · chroma upsert 落盘</text>
  <line x1="460" y1="794" x2="460" y2="818" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 拉起API -->
  <rect x="300" y="822" width="320" height="52" rx="6" fill="#fff" stroke="#1f3a5f" stroke-width="1.4"/>
  <text x="460" y="843" text-anchor="middle" fill="#111827" font-size="13" font-weight="bold">启动 API（后台常驻）</text>
  <text x="460" y="862" text-anchor="middle" fill="#374151" font-size="11">startup 预热加载嵌入模型 ~65s · 双检锁防并发段错误</text>
  <line x1="460" y1="874" x2="460" y2="898" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 健康自检 -->
  <polygon points="460,902 580,940 460,978 340,940" fill="#f5f6f8" stroke="#15803d" stroke-width="1.4"/>
  <text x="460" y="935" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="bold">端口回监听？</text>
  <text x="460" y="953" text-anchor="middle" fill="#111827" font-size="11">健康自检（最多 96s）</text>
  <line x1="340" y1="940" x2="212" y2="940" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="60" y="916" width="150" height="48" rx="6" fill="#f5f6f8" stroke="#b91c1c" stroke-dasharray="4 3"/>
  <text x="135" y="936" text-anchor="middle" fill="#111827" font-size="12">否 → 告警日志</text>
  <text x="135" y="954" text-anchor="middle" fill="#111827" font-size="10.5">api_nightly.log 排查</text>
  <text x="477" y="998" text-anchor="start" fill="#374151" font-size="10.5">是</text>
  <line x1="460" y1="978" x2="460" y2="1006" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 收工 -->
  <rect x="320" y="1010" width="280" height="46" rx="23" fill="#15803d"/>
  <text x="460" y="1039" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">全链路完成 · 新增数据即时可检索</text>

  <!-- 侧注：可靠性设计 -->
  <rect x="700" y="1020" width="200" height="106" rx="8" fill="#f5f6f8" stroke="#9ca3af"/>
  <text x="800" y="1044" text-anchor="middle" fill="#111827" font-size="12" font-weight="bold">可靠性设计</text>
  <g font-size="10.5" fill="#374151">
    <text x="800" y="1064" text-anchor="middle">· 逐阶段超时保护（3h）</text>
    <text x="800" y="1081" text-anchor="middle">· 失败不阻塞后续</text>
    <text x="800" y="1098" text-anchor="middle">· 锁自愈（死 PID 自动清）</text>
    <text x="800" y="1115" text-anchor="middle">· 全链路 35~67 分钟</text>
  </g>
</svg>
